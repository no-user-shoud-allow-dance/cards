<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="text-scale" content="scale" />

        <!--  -->

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

        <meta name="robots" content="index, follow" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="mobile-web-app-capable" content="yes" />

        <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
        <link rel="canonical" href="https://cards-three-beta-66.vercel.app/" />

        <!-- Project -->

        <meta name="application-name" content="NSC" />
        <meta name="author" content="Matvey Buldakov" />
        <meta name="contact" content="nousad@web.de" />
        <meta name="keywords" content="education, productivity, utilities, flashcards, cards" />
        <meta name="description" content="Vokabeln in Stapeln lernen – wiederholt bis sie sitzen." />
        <meta name="license" content="MIT" />
        <meta name="license:uri" content="https://opensource.org/license/mit" />

        <!-- Color scheme -->

        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191813" />

        <!-- Icons -->

        <link rel="icon" href="%sveltekit.assets%/favicon.svg" sizes="any" type="image/svg+xml" />
        <link rel="icon" href="%sveltekit.assets%/favicon-192.png" sizes="192x192" type="image/png" />
        <link rel="icon" href="%sveltekit.assets%/favicon-512.png" sizes="512x512" type="image/png" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
        <link rel="mask-icon" href="%sveltekit.assets%/favicon-monochrome.svg" color="#3d5a80" />

        <!-- Apple -->

        <meta name="apple-mobile-web-app-title" content="NSC" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

        <!-- OpenGraph -->

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="NSC" />
        <meta property="og:locale" content="de_DE" />
        <meta property="og:title" content="NSC" />
        <meta property="og:description" content="Vokabeln in Stapeln lernen – wiederholt bis sie sitzen." />
        <meta property="og:image" content="https://cards-three-beta-66.vercel.app/favicon-512.png" />
        <meta property="og:image:width" content="512" />
        <meta property="og:image:height" content="512" />
        <meta property="og:image:alt" content="NSC – Vokabeln lernen" />
        <meta property="og:url" content="https://cards-three-beta-66.vercel.app/" />

        <!-- Twitter -->

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="NSC" />
        <meta name="twitter:description" content="Vokabeln in Stapeln lernen – wiederholt bis sie sitzen." />
        <meta name="twitter:image" content="https://cards-three-beta-66.vercel.app/favicon-512.png" />

        <!-- Google Fonts -->

        <link
            href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />

        <!-- Default title -->
        <title>NSC</title>

        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
